<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등학교 특별실 예약 시스템</title>
    <!-- Supabase JS 라이브러리 (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 90s OS (Windows 95) 스타일 디자인 */
        body {
            background-color: #008080;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
            color: black;
            font-size: 14px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .window {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            margin-bottom: 15px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .title-bar {
            background-color: #000080;
            color: #ffffff;
            font-weight: bold;
            padding: 3px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title-bar-text {
            font-size: 14px;
            letter-spacing: 1px;
        }
        .window-body {
            padding: 15px;
        }
        button {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 4px 15px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        button:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 5px 14px 3px 16px;
        }
        input, select {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 4px;
            background: #ffffff;
            font-family: inherit;
            box-sizing: border-box;
            width: 100%;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }
        .form-group label {
            margin-bottom: 4px;
        }
        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row .form-group {
            flex: 1;
        }
        /* 테이블 (시간표) 디자인 */
        .table-wrapper {
            overflow-x: auto;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background: #ffffff;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
        }
        th, td {
            border: 1px solid #c0c0c0;
            padding: 6px;
            text-align: center;
        }
        th {
            background-color: #c0c0c0;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
        }
        td {
            height: 50px;
            vertical-align: middle;
        }
        .reserved-cell {
            background-color: #000080;
            color: white;
            font-weight: bold;
        }
        .reserved-meta {
            font-size: 11px;
            color: #ffff00;
            font-weight: normal;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-results {
            margin-top: 10px;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background: #ffffff;
            max-height: 200px;
            overflow-y: auto;
            padding: 2px;
        }
        .search-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            border-bottom: 1px dashed #c0c0c0;
        }
        
        /* 모바일 대응 */
        @media(min-width: 600px) {
            .form-group {
                flex-direction: row;
                align-items: center;
            }
            .form-group label {
                width: 100px;
                margin-bottom: 0;
            }
            .form-group input, .form-group select {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- 1. 예약 등록 창 -->
        <div class="window">
            <div class="title-bar">
                <span class="title-bar-text">특별실 예약 등록.exe</span>
            </div>
            <div class="window-body">
                <form id="reservation-form">
                    <div class="flex-row">
                        <div class="form-group">
                            <label>특별실</label>
                            <select id="room_id" name="room_id" required></select>
                        </div>
                        <div class="form-group">
                            <label>날짜</label>
                            <input type="date" id="reservation_date" name="reservation_date" required>
                        </div>
                        <div class="form-group">
                            <label>교시</label>
                            <select name="period" required>
                                <option value="1">1교시</option><option value="2">2교시</option>
                                <option value="3">3교시</option><option value="4">4교시</option>
                                <option value="5">5교시</option><option value="6">6교시</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex-row">
                        <div class="form-group">
                            <label>교사 이름</label>
                            <input type="text" name="teacher_name" required>
                        </div>
                        <div class="form-group">
                            <label>학년/반</label>
                            <div style="display:flex; gap:5px; flex:1;">
                                <input type="number" name="grade" min="1" max="6" placeholder="학년" required style="width:50%;">
                                <input type="number" name="class_number" min="1" placeholder="반" required style="width:50%;">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>사용 목적</label>
                        <input type="text" name="purpose" placeholder="(선택 사항)">
                    </div>
                    <div style="text-align: right; margin-top: 10px;">
                        <button type="submit">예약하기</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 2. 주간 시간표 창 -->
        <div class="window">
            <div class="title-bar">
                <span class="title-bar-text">주간 시간표 조회.exe</span>
            </div>
            <div class="window-body">
                <div class="toolbar">
                    <div style="display:flex; align-items:center; gap:5px; flex:1; min-width: 200px;">
                        <span>조회 특별실:</span>
                        <select id="tt-room-select" onchange="loadTimetable()" style="width: 150px;"></select>
                    </div>
                    <div>
                        <button onclick="changeWeek(-1)">◀ 이전 주</button>
                        <span id="week-label" style="margin:0 10px; font-weight:bold;"></span>
                        <button onclick="changeWeek(1)">다음 주 ▶</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="timetable">
                        <thead>
                            <tr>
                                <th>교시</th>
                                <th id="th-day-0">월</th>
                                <th id="th-day-1">화</th>
                                <th id="th-day-2">수</th>
                                <th id="th-day-3">목</th>
                                <th id="th-day-4">금</th>
                            </tr>
                        </thead>
                        <tbody id="tt-body">
                            <!-- JS로 채워짐 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 3. 예약 검색 및 취소 창 -->
        <div class="window">
            <div class="title-bar">
                <span class="title-bar-text">예약 검색 및 취소.exe</span>
            </div>
            <div class="window-body">
                <form id="search-form" class="flex-row" onsubmit="loadSearchList(event)" style="flex-wrap: wrap;">
                    <input type="text" id="search-teacher" placeholder="교사 이름 검색" style="width:120px;">
                    <select id="search-room" style="width:120px;">
                        <option value="">모든 특별실</option>
                    </select>
                    <input type="date" id="search-date" style="width:130px;">
                    <button type="submit">검색</button>
                </form>
                <div class="search-results" id="search-results">
                    <!-- 검색 결과 렌더링 -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. Supabase 초기 설정
        // ==========================================
        const SUPABASE_URL = 'https://hayzmdedaahowsudpkqr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_jfscPSXH2kq71Vu8WCf9Hg_ZX8bfOic';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // 2. 전역 상태 및 날짜 유틸
        // ==========================================
        let rooms = [];
        let currentWeekStart = getMonday(new Date());

        function getMonday(d) {
            d = new Date(d);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const date = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${date}`;
        }

        function addDays(d, days) {
            const nd = new Date(d);
            nd.setDate(nd.getDate() + days);
            return nd;
        }

        // ==========================================
        // 3. 초기화 (특별실 로드)
        // ==========================================
        async function init() {
            // 날짜 기본값 설정
            document.getElementById('reservation_date').value = formatDate(new Date());

            const { data, error } = await supabase.from('rooms').select('*').order('id');
            if (error) {
                alert('특별실 목록을 불러오는 데 실패했습니다.\nURL과 KEY를 확인해주세요.');
                return;
            }
            
            rooms = data || [];
            const roomSelect = document.getElementById('room_id');
            const ttSelect = document.getElementById('tt-room-select');
            const searchRoomSelect = document.getElementById('search-room');

            rooms.forEach(room => {
                const optName = `${room.name} (${room.location})`;
                
                // 예약 폼 select
                roomSelect.add(new Option(optName, room.id));
                // 시간표 select
                ttSelect.add(new Option(optName, room.id));
                // 검색 select
                searchRoomSelect.add(new Option(room.name, room.id));
            });

            loadTimetable();
            loadSearchList();
        }

        // ==========================================
        // 4. 예약 등록 로직
        // ==========================================
        document.getElementById('reservation-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const payload = {
                room_id: formData.get('room_id'),
                reservation_date: formData.get('reservation_date'),
                period: parseInt(formData.get('period')),
                teacher_name: formData.get('teacher_name'),
                grade: parseInt(formData.get('grade')),
                class_number: parseInt(formData.get('class_number')),
                purpose: formData.get('purpose')
            };

            const { error } = await supabase.from('reservations').insert([payload]);

            if (error) {
                // 고유 제약조건 위반 (동일 장소, 날짜, 교시)
                if (error.code === '23505') {
                    alert('이미 예약된 시간입니다.');
                    loadTimetable(); // 시간표 갱신
                } else {
                    alert('예약 오류 발생: ' + error.message);
                }
            } else {
                alert('예약이 성공적으로 등록되었습니다.');
                e.target.reset();
                document.getElementById('reservation_date').value = formatDate(new Date());
                loadTimetable();
                loadSearchList();
            }
        });

        // ==========================================
        // 5. 주간 시간표 로직
        // ==========================================
        function changeWeek(offset) {
            currentWeekStart = addDays(currentWeekStart, offset * 7);
            loadTimetable();
        }

        async function loadTimetable() {
            const currentRoomId = document.getElementById('tt-room-select').value;
            if (!currentRoomId) return;

            const dates = [];
            const weekDays = ['월', '화', '수', '목', '금'];
            
            for (let i = 0; i < 5; i++) {
                const cur = addDays(currentWeekStart, i);
                dates.push(formatDate(cur));
                document.getElementById(`th-day-${i}`).innerText = `${weekDays[i]} (${String(cur.getMonth()+1).padStart(2,'0')}/${String(cur.getDate()).padStart(2,'0')})`;
            }

            document.getElementById('week-label').innerText = `${dates[0].slice(5)} ~ ${dates[4].slice(5)}`;

            // 월~금 해당 특별실 예약 조회
            const { data, error } = await supabase
                .from('reservations')
                .select('*')
                .eq('room_id', currentRoomId)
                .gte('reservation_date', dates[0])
                .lte('reservation_date', dates[4]);

            const resMap = {};
            if (data) {
                data.forEach(r => {
                    resMap[`${r.reservation_date}-${r.period}`] = r;
                });
            }

            const tbody = document.getElementById('tt-body');
            tbody.innerHTML = '';

            for (let p = 1; p <= 6; p++) {
                const tr = document.createElement('tr');
                const tdHead = document.createElement('td');
                tdHead.innerText = `${p}교시`;
                tdHead.style.backgroundColor = '#e0e0e0';
                tr.appendChild(tdHead);

                for (let d = 0; d < 5; d++) {
                    const key = `${dates[d]}-${p}`;
                    const res = resMap[key];
                    const td = document.createElement('td');
                    
                    if (res) {
                        td.className = 'reserved-cell';
                        td.innerHTML = `
                            <div>${res.teacher_name}</div>
                            <div class="reserved-meta">${res.grade}학년 ${res.class_number}반</div>
                        `;
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // ==========================================
        // 6. 예약 검색 및 취소 로직
        // ==========================================
        async function loadSearchList(e) {
            if (e) e.preventDefault();
            
            const teacher = document.getElementById('search-teacher').value;
            const room = document.getElementById('search-room').value;
            const date = document.getElementById('search-date').value;

            // RLS 정책상 reservations 조회 가능 (rooms 테이블 조인)
            let query = supabase
                .from('reservations')
                .select('*, rooms(name)')
                .order('reservation_date', { ascending: false });

            if (teacher) query = query.ilike('teacher_name', `%${teacher}%`);
            if (room) query = query.eq('room_id', room);
            if (date) query = query.eq('reservation_date', date);

            const { data, error } = await query;
            const listDiv = document.getElementById('search-results');
            listDiv.innerHTML = '';

            if (error) {
                listDiv.innerHTML = `<div style="padding:10px; color:red;">검색 오류: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                listDiv.innerHTML = '<div style="padding:10px;">조건에 맞는 예약이 없습니다.</div>';
                return;
            }

            data.forEach(r => {
                const div = document.createElement('div');
                div.className = 'search-item';
                
                const roomName = r.rooms ? r.rooms.name : '알수없음';
                const infoText = `[${r.reservation_date}] ${roomName} ${r.period}교시 - ${r.teacher_name} (${r.grade}-${r.class_number}) ${r.purpose ? '/ '+r.purpose : ''}`;
                
                const infoSpan = document.createElement('span');
                infoSpan.textContent = infoText;
                
                const delBtn = document.createElement('button');
                delBtn.textContent = '취소';
                delBtn.onclick = () => cancelReservation(r.id);

                div.appendChild(infoSpan);
                div.appendChild(delBtn);
                listDiv.appendChild(div);
            });
        }

        async function cancelReservation(id) {
            if (confirm('선택한 예약을 정말 취소하시겠습니까?')) {
                const { error } = await supabase.from('reservations').delete().eq('id', id);
                if (error) {
                    alert('취소 중 오류가 발생했습니다.');
                } else {
                    alert('예약이 삭제되었습니다.');
                    loadTimetable();
                    loadSearchList();
                }
            }
        }

        // 앱 시작
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
